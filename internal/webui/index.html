<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Light-Kanban 任务看板</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <h1>Light-Kanban 任务看板</h1>
    <div class="topbar-right">
      <button id="add-task-btn" class="primary-btn" type="button">＋ 添加任务</button>
      <button id="history-toggle" class="ghost-btn" type="button">归档历史</button>
      <span id="connection" class="connection ok" title="连接状态">●</span>
    </div>
  </header>

  <main id="board" class="board"></main>

  <!-- 添加任务弹窗 -->
  <div id="add-modal" class="modal-backdrop hidden">
    <form id="add-form" class="modal" autocomplete="off">
      <h3>添加任务</h3>
      <label>标题 <input name="title" required></label>
      <label>workspace 文件夹
        <span class="path-row">
          <input name="workspacePath" required placeholder="任务对应的项目文件夹路径">
          <button type="button" class="browse-btn" data-browse-target="add" title="在页面里浏览服务器文件夹">浏览…</button>
          <button type="button" class="browse-btn" data-pick-target="add" title="调起服务器所在电脑的系统文件夹对话框">系统选择…</button>
        </span>
      </label>
      <label>描述 / 指令正文 <textarea name="description" rows="3" placeholder="给 agent 的指令正文（可选）"></textarea></label>
      <label>标签（逗号分隔多个，如 go, ui） <input name="tags"></label>
      <label>截止时间（留空表示无截止） <input name="dueAt" type="datetime-local"></label>
      <div class="modal-actions">
        <button type="submit">添加</button>
        <button type="button" id="add-cancel">取消</button>
      </div>
    </form>
  </div>

  <!-- 编辑任务弹窗 -->
  <div id="edit-modal" class="modal-backdrop hidden">
    <form id="edit-form" class="modal" autocomplete="off">
      <h3>编辑任务</h3>
      <label>标题 <input name="title" required></label>
      <label>workspace 文件夹
        <span class="path-row">
          <input name="workspacePath" required>
          <button type="button" class="browse-btn" data-browse-target="edit" title="在页面里浏览服务器文件夹">浏览…</button>
          <button type="button" class="browse-btn" data-pick-target="edit" title="调起服务器所在电脑的系统文件夹对话框">系统选择…</button>
        </span>
      </label>
      <label>描述 / 指令正文 <textarea name="description" rows="3"></textarea></label>
      <label>标签（逗号分隔多个） <input name="tags"></label>
      <label>截止时间（留空表示无截止） <input name="dueAt" type="datetime-local"></label>
      <label>状态（人工纠正用）
        <select name="status">
          <option value="todo">待处理</option>
          <option value="in_progress">处理中</option>
          <option value="blocked">遇到阻碍</option>
          <option value="awaiting_confirmation">等你确认</option>
          <option value="archived">已归档</option>
        </select>
      </label>
      <div class="modal-actions">
        <button type="submit">保存</button>
        <button type="button" id="edit-cancel">取消</button>
      </div>
    </form>
  </div>

  <!-- 归档历史弹窗 -->
  <div id="archive-modal" class="modal-backdrop hidden">
    <div class="modal archive-modal">
      <h3>已归档历史 <span id="archive-count" class="archive-count"></span></h3>
      <div class="archive-toolbar">
        <label class="archive-select-all"><input type="checkbox" id="archive-select-all"> 全选</label>
        <button type="button" id="archive-delete-selected" class="danger-btn" disabled>删除选中</button>
      </div>
      <div id="archive-list" class="history-list"></div>
      <div class="modal-actions">
        <button type="button" id="archive-close">关闭</button>
      </div>
    </div>
  </div>

  <!-- 文件夹浏览弹窗 -->
  <div id="browse-modal" class="modal-backdrop hidden">
    <div class="modal browse-modal">
      <h3>选择 workspace 文件夹</h3>
      <div id="browse-path" class="browse-path" title="">/</div>
      <div id="browse-listing" class="browse-listing"></div>
      <div class="modal-actions">
        <button type="button" id="browse-up">上级</button>
        <button type="button" id="browse-select">选择此文件夹</button>
        <button type="button" id="browse-cancel">取消</button>
      </div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
