<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Light-Kanban 任务看板</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <h1>Light-Kanban 任务看板</h1>
    <div class="topbar-right">
      <button id="history-toggle" class="ghost-btn" type="button">归档历史</button>
      <form id="identity-form" class="identity" autocomplete="off">
        <label>我是 agent：
          <input name="agentId" placeholder="agentId *" size="10" required>
          <input name="name" placeholder="名称" size="8">
          <input name="avatar" placeholder="头像（emoji）" size="4">
        </label>
        <button type="submit" title="保存身份到本地">保存</button>
      </form>
      <span id="connection" class="connection ok" title="连接状态">●</span>
    </div>
  </header>

  <section class="add-task">
    <form id="add-form" autocomplete="off">
      <div class="add-row">
        <input name="title" placeholder="任务标题 *" required>
        <input name="workspacePath" placeholder="workspace 文件夹路径 *" required>
        <input name="type" placeholder="类型（可选）">
        <input name="tags" placeholder="标签，逗号分隔（可选）">
        <input name="dueAt" type="datetime-local" title="截止时间（可选）">
        <button type="submit">添加任务</button>
      </div>
      <textarea name="description" rows="2" placeholder="描述 / 指令正文（可选）"></textarea>
    </form>
  </section>

  <section class="agents-panel">
    <details id="agents-details">
      <summary>Agent 管理</summary>
      <form id="agent-form" class="agent-form" autocomplete="off">
        <input name="id" placeholder="agent id *" required>
        <input name="name" placeholder="名称">
        <input name="avatar" placeholder="头像（emoji）">
        <button type="submit">预配置 / 更新</button>
      </form>
      <ul id="agent-list" class="agent-list"></ul>
    </details>
  </section>

  <main id="board" class="board"></main>

  <section id="history" class="history hidden">
    <h2>已归档历史</h2>
    <div id="history-list" class="history-list"></div>
  </section>

  <div id="edit-modal" class="modal-backdrop hidden">
    <form id="edit-form" class="modal" autocomplete="off">
      <h3>编辑任务</h3>
      <label>标题 <input name="title" required></label>
      <label>workspace 文件夹 <input name="workspacePath" required></label>
      <label>描述 / 指令正文 <textarea name="description" rows="3"></textarea></label>
      <label>类型 <input name="type"></label>
      <label>标签（逗号分隔） <input name="tags"></label>
      <label>截止时间 <input name="dueAt" type="datetime-local"></label>
      <div class="modal-actions">
        <button type="submit">保存</button>
        <button type="button" id="edit-cancel">取消</button>
      </div>
    </form>
  </div>

  <script src="/app.js"></script>
</body>
</html>
