<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="docTitle">Light-Kanban 任务看板</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <h1 data-i18n="docTitle">Light-Kanban 任务看板</h1>
    <div class="topbar-right">
      <button id="add-task-btn" class="primary-btn" type="button" data-i18n="topbar.add">＋ 添加任务</button>
      <button id="lang-toggle" class="ghost-btn" type="button" title="">EN</button>
      <button id="wizard-open" class="ghost-btn" type="button" data-i18n="topbar.wizard" data-i18n-title="topbar.wizardTitle">使用向导</button>
      <button id="history-toggle" class="ghost-btn" type="button" data-i18n="topbar.history" data-i18n-title="topbar.historyTitle">归档历史</button>
      <span id="connection" class="connection ok" title="">●</span>
    </div>
  </header>

  <main id="board" class="board"></main>

  <!-- 添加任务弹窗 -->
  <div id="add-modal" class="modal-backdrop hidden">
    <form id="add-form" class="modal" autocomplete="off">
      <h3 data-i18n="add.title">添加任务</h3>
      <label><span data-i18n="add.titleField">标题</span> <input name="title" required data-i18n-ph="add.phTitle"></label>
      <label><span data-i18n="add.workspaceField">workspace 文件夹</span>
        <span class="path-row">
          <input name="workspacePath" required data-i18n-ph="add.phWorkspace">
          <button type="button" class="browse-btn" data-browse-target="add" data-i18n="browse.browse" data-i18n-title="browse.browseTitle">浏览…</button>
          <button type="button" class="browse-btn" data-pick-target="add" data-i18n="browse.pick" data-i18n-title="browse.pickTitle">系统选择…</button>
        </span>
      </label>
      <label><span data-i18n="add.descField">描述 / 指令正文</span> <textarea name="description" rows="3" data-i18n-ph="add.phDesc"></textarea></label>
      <label><span data-i18n="add.tagsField">标签（逗号分隔多个，如 go, ui）</span> <input name="tags" data-i18n-ph="add.phTags"></label>
      <label><span data-i18n="add.dueField">截止时间（留空表示无截止）</span> <input name="dueAt" type="datetime-local"></label>
      <div class="modal-actions">
        <button type="submit" data-i18n="add.submit">添加</button>
        <button type="button" id="add-cancel" data-i18n="common.cancel">取消</button>
      </div>
    </form>
  </div>

  <!-- 编辑任务弹窗 -->
  <div id="edit-modal" class="modal-backdrop hidden">
    <form id="edit-form" class="modal" autocomplete="off">
      <h3 data-i18n="edit.title">编辑任务</h3>
      <label><span data-i18n="edit.titleField">标题</span> <input name="title" required></label>
      <label><span data-i18n="edit.workspaceField">workspace 文件夹</span>
        <span class="path-row">
          <input name="workspacePath" required>
          <button type="button" class="browse-btn" data-browse-target="edit" data-i18n="browse.browse" data-i18n-title="browse.browseTitle">浏览…</button>
          <button type="button" class="browse-btn" data-pick-target="edit" data-i18n="browse.pick" data-i18n-title="browse.pickTitle">系统选择…</button>
        </span>
      </label>
      <label><span data-i18n="edit.descField">描述 / 指令正文</span> <textarea name="description" rows="3"></textarea></label>
      <label><span data-i18n="edit.tagsField">标签（逗号分隔多个）</span> <input name="tags"></label>
      <label><span data-i18n="edit.dueField">截止时间（留空表示无截止）</span> <input name="dueAt" type="datetime-local"></label>
      <label><span data-i18n="edit.statusField">状态（人工纠正用）</span>
        <select name="status">
          <option value="todo" data-i18n="status.todo">待处理</option>
          <option value="in_progress" data-i18n="status.in_progress">处理中</option>
          <option value="blocked" data-i18n="status.blocked">遇到阻碍</option>
          <option value="awaiting_confirmation" data-i18n="status.awaiting_confirmation">等你确认</option>
          <option value="archived" data-i18n="status.archived">已归档</option>
        </select>
      </label>
      <div class="modal-actions">
        <button type="submit" data-i18n="edit.submit">保存</button>
        <button type="button" id="edit-cancel" data-i18n="common.cancel">取消</button>
      </div>
    </form>
  </div>

  <!-- 归档历史弹窗 -->
  <div id="archive-modal" class="modal-backdrop hidden">
    <div class="modal archive-modal">
      <h3><span data-i18n="archive.title">已归档历史</span> <span id="archive-count" class="archive-count"></span></h3>
      <div class="archive-toolbar">
        <label class="archive-select-all"><input type="checkbox" id="archive-select-all"> <span data-i18n="archive.selectAll">全选</span></label>
        <button type="button" id="archive-delete-selected" class="danger-btn" disabled data-i18n="archive.deleteSelected">删除选中</button>
      </div>
      <div id="archive-list" class="history-list"></div>
      <div class="modal-actions">
        <button type="button" id="archive-close" data-i18n="archive.close">关闭</button>
      </div>
    </div>
  </div>

  <!-- 首次使用引导向导 -->
  <div id="wizard-modal" class="modal-backdrop hidden">
    <div class="modal wizard-modal">
      <h3 data-i18n="wizard.welcome">欢迎使用 Light-Kanban 任务看板</h3>
      <div id="wizard-steps" class="wizard-steps"></div>
      <div id="wizard-dots" class="wizard-dots"></div>
      <div class="modal-actions">
        <button type="button" id="wizard-skip" data-i18n="wizard.skip">跳过</button>
        <button type="button" id="wizard-prev" class="hidden" data-i18n="wizard.prev">上一步</button>
        <button type="button" id="wizard-next" data-i18n="wizard.next">下一步</button>
        <button type="button" id="wizard-finish" class="hidden" data-i18n="wizard.finish">开始使用</button>
      </div>
    </div>
  </div>

  <!-- 文件夹浏览弹窗 -->
  <div id="browse-modal" class="modal-backdrop hidden">
    <div class="modal browse-modal">
      <h3 data-i18n="browse.title">选择 workspace 文件夹</h3>
      <div id="browse-path" class="browse-path" title="">/</div>
      <div id="browse-listing" class="browse-listing"></div>
      <div class="modal-actions">
        <button type="button" id="browse-up" data-i18n="browse.up">上级</button>
        <button type="button" id="browse-select" data-i18n="browse.select">选择此文件夹</button>
        <button type="button" id="browse-cancel" data-i18n="common.cancel">取消</button>
      </div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
